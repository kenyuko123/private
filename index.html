<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RDP Machine Receiver</title>

<style>
:root{
    color-scheme:dark;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    padding:24px;
    display:grid;
    place-items:center;
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    color:#f8fafc;
    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(99,102,241,.28),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(14,165,233,.18),
            transparent 35%
        ),
        #080b14;
}

.card{
    width:min(760px,100%);
    padding:28px;
    border-radius:24px;
    background:rgba(15,23,42,.82);
    border:1px solid rgba(148,163,184,.18);
    box-shadow:0 24px 70px rgba(0,0,0,.35);
    backdrop-filter:blur(16px);
}

.header{
    display:flex;
    gap:16px;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
}

h1{
    margin:0;
    font-size:clamp(24px,5vw,34px);
}

.muted{
    color:#94a3b8;
    margin:7px 0 0;
}

button{
    border:0;
    border-radius:14px;
    padding:13px 18px;
    font-weight:800;
    cursor:pointer;
    color:white;
    background:linear-gradient(135deg,#6366f1,#0ea5e9);
    box-shadow:0 10px 28px rgba(14,165,233,.22);
    transition:
        transform .15s ease,
        opacity .15s ease;
}

button:hover{
    transform:translateY(-1px);
}

button:active{
    transform:translateY(0);
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
    transform:none;
}

.accept{
    background:linear-gradient(135deg,#16a34a,#22c55e);
}

.download{
    width:100%;
    margin-top:20px;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
}

.status{
    margin-top:22px;
    padding:14px 16px;
    border-radius:14px;
    background:rgba(30,41,59,.8);
    border:1px solid rgba(148,163,184,.14);
    color:#cbd5e1;
}

.dot{
    display:inline-block;
    width:9px;
    height:9px;
    border-radius:50%;
    background:#64748b;
    margin-right:8px;
}

.dot.live{
    background:#22c55e;
    box-shadow:0 0 14px rgba(34,197,94,.7);
}

.grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));
    gap:14px;
    margin-top:18px;
}

.item{
    padding:16px;
    border-radius:16px;
    background:rgba(2,6,23,.55);
    border:1px solid rgba(148,163,184,.12);
}

.label{
    color:#94a3b8;
    font-size:13px;
    margin-bottom:7px;
}

.value{
    font-size:18px;
    font-weight:750;
    word-break:break-word;
}

.mono{
    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
}

.row{
    display:flex;
    gap:8px;
    align-items:center;
}

.row .value{
    flex:1;
}

.copy{
    padding:8px 11px;
    border-radius:10px;
    font-size:12px;
    background:#1e293b;
    box-shadow:none;
    white-space:nowrap;
}

.hidden{
    display:none!important;
}

.footer{
    margin-top:16px;
    color:#64748b;
    font-size:12px;
    text-align:center;
}

.download-section{
    margin-top:26px;
    padding-top:20px;
    border-top:1px solid rgba(148,163,184,.12);
}

.download-title{
    text-align:center;
    color:#94a3b8;
    font-size:13px;
    margin-bottom:10px;
}
</style>
</head>

<body>

<main class="card">

    <div class="header">

        <div>
            <h1>RDP Machine Receiver</h1>
            <p class="muted">
                Gửi lệnh tạo máy và chờ thông tin RDP.
            </p>
        </div>

        <div>
            <button id="receive">
                Nhận máy
            </button>

            <button
                id="accepted"
                class="accept hidden">
                Đã nhận máy
            </button>
        </div>

    </div>


    <div class="status">
        <span id="dot" class="dot"></span>
        <span id="statusText">
            Sẵn sàng.
        </span>
    </div>


    <!-- MACHINE INFO -->
    <section id="machine" class="hidden">

        <div class="grid">

            <!-- ADDRESS -->
            <div class="item">

                <div class="label">
                    ADDRESS
                </div>

                <div class="row">

                    <div
                        id="address"
                        class="value mono">
                        —
                    </div>

                    <button
                        class="copy"
                        data-copy="address">
                        Copy
                    </button>

                </div>

            </div>


            <!-- USERNAME -->
            <div class="item">

                <div class="label">
                    USERNAME
                </div>

                <div class="row">

                    <div
                        id="username"
                        class="value mono">
                        —
                    </div>

                    <button
                        class="copy"
                        data-copy="username">
                        Copy
                    </button>

                </div>

            </div>


            <!-- PASSWORD -->
            <div class="item">

                <div class="label">
                    PASSWORD
                </div>

                <div class="row">

                    <div
                        id="password"
                        class="value mono">
                        —
                    </div>

                    <button
                        class="copy"
                        data-copy="password">
                        Copy
                    </button>

                </div>

            </div>

        </div>

    </section>


    <!-- DOWNLOAD MAIN.PY -->
    <div class="download-section">

        <div class="download-title">
            Công cụ điều khiển RDP
        </div>

        <button
            id="downloadMain"
            class="download">
            Tải main.py
        </button>

    </div>


    <div class="footer">
        Firebase command queue · machine data
    </div>

</main>


<script>

/* =========================================================
   CONFIG
   ========================================================= */

const FIREBASE_BASE =
"https://realtime-database-bee52-default-rtdb.asia-southeast1.firebasedatabase.app";


/*
 * THAY LINK NÀY BẰNG LINK GITHUB MAIN.PY CỦA BẠN
 *
 * Ví dụ:
 * https://github.com/Kenyuko/rdp/blob/main/main.py
 *
 * Hoặc link raw:
 * https://raw.githubusercontent.com/Kenyuko/rdp/main/main.py
 */
const MAIN_PY_URL =
"blob:https://github.com/264afced-7475-45f9-9eff-1e9098ebb6c8";


const COMMAND_URL =
FIREBASE_BASE + "/rdp/command.json";

const MACHINE_URL =
FIREBASE_BASE + "/rdp/latest.json";

const POLL_MS = 2000;


/* =========================================================
   ELEMENTS
   ========================================================= */

const receiveBtn =
document.getElementById("receive");

const acceptedBtn =
document.getElementById("accepted");

const downloadMain =
document.getElementById("downloadMain");

const statusText =
document.getElementById("statusText");

const dot =
document.getElementById("dot");

const machine =
document.getElementById("machine");

const address =
document.getElementById("address");

const username =
document.getElementById("username");

const password =
document.getElementById("password");


/* =========================================================
   STATE
   ========================================================= */

let polling = false;
let timer = null;
let hasMachine = false;


/* =========================================================
   STATUS
   ========================================================= */

function status(text, live = false){

    statusText.textContent = text;

    dot.classList.toggle(
        "live",
        live
    );
}


/* =========================================================
   REQUEST ID
   ========================================================= */

function requestId(){

    if(
        window.crypto &&
        crypto.randomUUID
    ){
        return crypto.randomUUID();
    }

    return (
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .slice(2)
    );
}


/* =========================================================
   FIREBASE REQUEST
   ========================================================= */

async function firebase(
    url,
    options = {}
){

    const separator =
        url.includes("?")
            ? "&"
            : "?";

    const res = await fetch(
        url +
        separator +
        "t=" +
        Date.now(),
        {
            cache:"no-store",
            ...options
        }
    );


    if(
        res.status === 401 ||
        res.status === 403
    ){

        throw new Error(
            "Firebase Rules chặn truy cập (HTTP " +
            res.status +
            ")"
        );

    }


    if(!res.ok){

        throw new Error(
            "Firebase HTTP " +
            res.status
        );

    }


    const text =
        await res.text();

    return text
        ? JSON.parse(text)
        : null;
}


/* =========================================================
   CREATE COMMAND
   ========================================================= */

async function sendCreate(){

    const command = {

        action:"create",

        request_id:
            requestId(),

        created_at:
            new Date().toISOString()

    };


    await firebase(
        COMMAND_URL,
        {
            method:"PUT",

            headers:{
                "Content-Type":
                    "application/json"
            },

            body:
                JSON.stringify(command)
        }
    );


    return command.request_id;
}


/* =========================================================
   SHOW MACHINE
   ========================================================= */

function showMachine(data){

    address.textContent =
        data.address || "—";

    username.textContent =
        data.username || "—";

    password.textContent =
        data.password || "—";

    machine.classList.remove(
        "hidden"
    );
}


/* =========================================================
   POLLING TIMER
   ========================================================= */

function schedule(){

    if(!polling){
        return;
    }

    clearTimeout(timer);

    timer = setTimeout(
        checkMachine,
        POLL_MS
    );
}


/* =========================================================
   CHECK MACHINE
   ========================================================= */

async function checkMachine(){

    if(!polling){
        return;
    }


    try{

        const data =
            await firebase(
                MACHINE_URL
            );


        if(
            data &&
            data.address &&
            data.username &&
            data.password
        ){

            showMachine(data);

            polling = false;

            hasMachine = true;

            receiveBtn.disabled =
                true;

            receiveBtn.textContent =
                "Máy đã nhận";


            /*
             * Chỉ hiện nút Đã nhận máy.
             * Không còn nút "Nhận máy khác".
             */

            acceptedBtn.classList.remove(
                "hidden"
            );


            status(
                "Máy đã sẵn sàng · " +
                data.address,
                true
            );

            return;
        }


        status(
            "Lệnh đã gửi. Đang chờ main.py tạo máy…"
        );

        schedule();

    }
    catch(e){

        status(
            e.message
        );

        schedule();
    }
}


/* =========================================================
   NHẬN MÁY
   ========================================================= */

receiveBtn.addEventListener(
    "click",
    async () => {

        clearTimeout(timer);

        receiveBtn.disabled =
            true;

        acceptedBtn.classList.add(
            "hidden"
        );

        machine.classList.add(
            "hidden"
        );

        hasMachine = false;


        status(
            "Đang gửi lệnh tạo máy…"
        );


        try{

            const id =
                await sendCreate();


            polling = true;


            receiveBtn.textContent =
                "Đang chờ máy…";


            status(
                "Đã gửi lệnh " +
                id.slice(0,12) +
                "…"
            );


            checkMachine();

        }
        catch(e){

            receiveBtn.disabled =
                false;

            receiveBtn.textContent =
                "Nhận máy";


            status(
                e.message
            );
        }

    }
);


/* =========================================================
   ĐÃ NHẬN MÁY
   ========================================================= */

acceptedBtn.addEventListener(
    "click",
    async () => {

        if(!hasMachine){
            return;
        }


        acceptedBtn.disabled =
            true;

        status(
            "Đang xoá thông tin máy…"
        );


        try{

            await firebase(
                MACHINE_URL,
                {
                    method:"DELETE"
                }
            );


            hasMachine = false;

            polling = false;

            clearTimeout(timer);


            machine.classList.add(
                "hidden"
            );


            acceptedBtn.classList.add(
                "hidden"
            );


            acceptedBtn.disabled =
                false;


            /*
             * Sau khi nhận máy xong,
             * chỉ reset về nút Nhận máy.
             */

            receiveBtn.disabled =
                false;

            receiveBtn.textContent =
                "Nhận máy";


            status(
                "Đã nhận máy và xoá thông tin khỏi Firebase.",
                true
            );

        }
        catch(e){

            acceptedBtn.disabled =
                false;

            status(
                "Không xoá được: " +
                e.message
            );
        }

    }
);


/* =========================================================
   COPY BUTTONS
   ========================================================= */

document
.querySelectorAll("[data-copy]")
.forEach(btn => {

    btn.addEventListener(
        "click",
        async () => {

            const el =
                document.getElementById(
                    btn.dataset.copy
                );


            try{

                await navigator
                    .clipboard
                    .writeText(
                        el.textContent
                    );


                const old =
                    btn.textContent;


                btn.textContent =
                    "Đã copy";


                setTimeout(
                    () => {
                        btn.textContent =
                            old;
                    },
                    1000
                );

            }
            catch{

                alert(
                    "Không copy được."
                );
            }

        }
    );

});


/* =========================================================
   DOWNLOAD / GITHUB MAIN.PY
   ========================================================= */

downloadMain.addEventListener(
    "click",
    () => {

        window.open(
            MAIN_PY_URL,
            "_blank",
            "noopener,noreferrer"
        );

    }
);

</script>

</body>
</html>
