<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDP Machine Receiver</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f8fafc;background:radial-gradient(circle at 15% 15%,rgba(99,102,241,.28),transparent 35%),radial-gradient(circle at 85% 80%,rgba(14,165,233,.18),transparent 35%),#080b14}.card{width:min(760px,100%);padding:28px;border-radius:24px;background:rgba(15,23,42,.82);border:1px solid rgba(148,163,184,.18);box-shadow:0 24px 70px rgba(0,0,0,.35);backdrop-filter:blur(16px)}.header{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{margin:0;font-size:clamp(24px,5vw,34px)}.muted{color:#94a3b8;margin:7px 0 0}button{border:0;border-radius:14px;padding:13px 18px;font-weight:800;cursor:pointer;color:white;background:linear-gradient(135deg,#6366f1,#0ea5e9);box-shadow:0 10px 28px rgba(14,165,233,.22)}button:disabled{opacity:.55;cursor:not-allowed}.accept{background:linear-gradient(135deg,#16a34a,#22c55e)}.status{margin-top:22px;padding:14px 16px;border-radius:14px;background:rgba(30,41,59,.8);border:1px solid rgba(148,163,184,.14);color:#cbd5e1}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#64748b;margin-right:8px}.dot.live{background:#22c55e;box-shadow:0 0 14px rgba(34,197,94,.7)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}.item{padding:16px;border-radius:16px;background:rgba(2,6,23,.55);border:1px solid rgba(148,163,184,.12)}.label{color:#94a3b8;font-size:13px;margin-bottom:7px}.value{font-size:18px;font-weight:750;word-break:break-word}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.row{display:flex;gap:8px;align-items:center}.row .value{flex:1}.copy{padding:8px 11px;border-radius:10px;font-size:12px;background:#1e293b;box-shadow:none;white-space:nowrap}.hidden{display:none!important}.footer{margin-top:16px;color:#64748b;font-size:12px;text-align:center}
</style></head><body><main class="card"><div class="header"><div><h1>RDP Machine Receiver</h1><p class="muted">Bấm “Nhận máy” để gửi lệnh tạo máy.</p></div><div><button id="receive">Nhận máy</button><button id="accepted" class="accept hidden">Đã nhận máy</button></div></div><div class="status"><span id="dot" class="dot"></span><span id="statusText">Sẵn sàng.</span></div><section id="machine" class="hidden"><div class="grid"><div class="item"><div class="label">ADDRESS</div><div class="row"><div id="address" class="value mono">—</div><button class="copy" data-copy="address">Copy</button></div></div><div class="item"><div class="label">USERNAME</div><div class="row"><div id="username" class="value mono">—</div><button class="copy" data-copy="username">Copy</button></div></div><div class="item"><div class="label">PASSWORD</div><div class="row"><div id="password" class="value mono">—</div><button class="copy" data-copy="password">Copy</button></div></div></div></section><div class="footer">Firebase command queue · machine data</div></main>
<script>
const FIREBASE_BASE="https://realtime-database-bee52-default-rtdb.asia-southeast1.firebasedatabase.app";
const COMMAND_URL=FIREBASE_BASE+"/rdp/command.json", MACHINE_URL=FIREBASE_BASE+"/rdp/latest.json", POLL_MS=2000;
const receive=document.getElementById('receive'),accepted=document.getElementById('accepted'),statusText=document.getElementById('statusText'),dot=document.getElementById('dot'),machine=document.getElementById('machine'),address=document.getElementById('address'),username=document.getElementById('username'),password=document.getElementById('password');
let polling=false,timer=null,hasMachine=false;
function setStatus(t,live=false){statusText.textContent=t;dot.classList.toggle('live',live)}
function rid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)}
async function fb(url,opt={}){const r=await fetch(url+'?t='+Date.now(),{cache:'no-store',...opt});if(r.status===401||r.status===403)throw Error('Firebase Rules chặn truy cập (HTTP '+r.status+')');if(!r.ok)throw Error('Firebase HTTP '+r.status);const t=await r.text();return t?JSON.parse(t):null}
async function sendCommand(){const command={action:'create',request_id:rid(),created_at:new Date().toISOString()};await fb(COMMAND_URL,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(command)});return command.request_id}
function schedule(){if(!polling)return;clearTimeout(timer);timer=setTimeout(checkMachine,POLL_MS)}
async function checkMachine(){if(!polling)return;try{const d=await fb(MACHINE_URL);if(d&&d.address&&d.username&&d.password){address.textContent=d.address;username.textContent=d.username;password.textContent=d.password;machine.classList.remove('hidden');polling=false;hasMachine=true;receive.disabled=false;receive.textContent='Nhận máy khác';accepted.classList.remove('hidden');setStatus('Máy đã sẵn sàng · '+d.address,true);return}setStatus('Đang chờ main.py tạo máy…');schedule()}catch(e){setStatus(e.message);schedule()}}
receive.addEventListener('click',async()=>{clearTimeout(timer);receive.disabled=true;accepted.classList.add('hidden');machine.classList.add('hidden');hasMachine=false;setStatus('Đang gửi lệnh tạo máy…');try{const id=await sendCommand();polling=true;receive.textContent='Đang chờ máy…';setStatus('Đã gửi lệnh '+id.slice(0,12)+'…');checkMachine()}catch(e){receive.disabled=false;receive.textContent='Nhận máy';setStatus(e.message)}});
accepted.addEventListener('click',async()=>{if(!hasMachine)return;accepted.disabled=true;receive.disabled=true;setStatus('Đang xoá thông tin máy…');try{await fb(MACHINE_URL,{method:'DELETE'});hasMachine=false;polling=false;clearTimeout(timer);machine.classList.add('hidden');accepted.classList.add('hidden');accepted.disabled=false;receive.disabled=false;receive.textContent='Nhận máy';setStatus('Đã nhận máy và xoá thông tin khỏi Firebase.',true)}catch(e){accepted.disabled=false;receive.disabled=false;setStatus('Không xoá được: '+e.message)}});
document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(document.getElementById(b.dataset.copy).textContent);const x=b.textContent;b.textContent='Đã copy';setTimeout(()=>b.textContent=x,1000)}catch{alert('Không copy được.')}}));
</script></body></html>
